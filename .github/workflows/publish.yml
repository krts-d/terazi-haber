# Fetches the news, builds the site and publishes it on GitHub Pages.
# Runs every 20 minutes, whenever you push to main, and from the
# "Run workflow" button on the Actions tab.
name: Update and publish

on:
  schedule:
    # A few minutes past the busy top of the hour. GitHub may start
    # scheduled runs late (or skip one) when it is busy.
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # only for the keep-alive commit at the end
  pages: write
  id-token: write

# One run at a time; a run that starts while another is busy waits for it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, mbstring, pdo_sqlite, simplexml, fileinfo
          coverage: none

      - id: pages
        uses: actions/configure-pages@v6

      - name: Fetch the news and build the site
        run: bash ci.sh "${{ steps.pages.outputs.base_url }}"
        env:
          TERAZI_SITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      # GitHub pauses scheduled runs in a public repository after 60 days
      # without commits. An empty commit every 50 quiet days keeps them going.
      - name: Keep the schedule running
        if: github.event_name == 'schedule'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled updates running"
            git push || echo "::warning::Couldn't push the keep-alive commit; it will be tried again on the next run."
          fi
